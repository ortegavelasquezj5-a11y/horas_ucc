{% extends "base.html" %}
{% block titulo %}Editar programa{% endblock %}
{% block contenido %}
<a href="{% url 'usuarios:programas' %}" class="small">← Programas</a>
<h1 class="titulo-pagina mt-1 mb-3">Editar {{ object.nombre }}</h1>
<form method="post" class="tarjeta p-4" style="max-width: 520px" novalidate>
  {% csrf_token %}
  {% include "partials/campo.html" with campo=form.nombre %}
  {% include "partials/campo.html" with campo=form.meta_horas %}
  <button class="btn btn-ucc">Guardar</button>
  <a href="{% url 'usuarios:programas' %}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
