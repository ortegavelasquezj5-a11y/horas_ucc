<div class="mb-3">
  {% if campo.widget_type == "checkbox" %}
    <div class="form-check">{{ campo }} <label for="{{ campo.id_for_label }}" class="form-check-label">{{ campo.label }}</label></div>
  {% else %}
    <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% for error in campo.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
</div>
